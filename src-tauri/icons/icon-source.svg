<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Flight School app icon: the tile inset 47/512 like Pigeon's, so macOS sees its expected margin -->
  <g transform="translate(47 47) scale(0.81640625)">
  <rect width="512" height="512" rx="114" fill="#16283a"/>
  <!-- ink line the quill has just written -->
  <path d="M92 446c28 16 54-14 84-2s50 18 80 2 52-16 76-4" fill="none" stroke="#d8e7f0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(264 220) rotate(40) scale(1.12)">
    <!-- vane: a pigeon feather, a touch lopsided like a real one -->
    <path d="M0-214C74-172 86-48 42 92H-34C-80-18-66-170 0-214Z" fill="#b4bac0"/>
    <!-- splits in the vane, cut out like Patch's wing marks -->
    <path d="M78-92 44-64M-68-20-36 4M68 10 38 34" fill="none" stroke="#16283a" stroke-width="13" stroke-linecap="round"/>
    <!-- shaft -->
    <path d="M0-176C6-90 8 0 4 96" fill="none" stroke="#16283a" stroke-width="9" stroke-linecap="round"/>
    <!-- neck-sheen speckles -->
    <rect x="-44" y="-120" width="18" height="36" rx="9" fill="#a58fc0" transform="rotate(-10 -35 -102)"/>
    <rect x="-40" y="-72" width="18" height="36" rx="9" fill="#d8e7f0" transform="rotate(-10 -31 -54)"/>
    <!-- bare quill -->
    <rect x="-9" y="88" width="20" height="34" fill="#d8e7f0"/>
    <!-- ferrule, same brown as Patch's glasses -->
    <rect x="-30" y="116" width="62" height="30" rx="12" fill="#42210b"/>
    <!-- nib, two-tone like Patch's beak -->
    <path d="M-26 146H1V238Z" fill="#ffb340"/>
    <path d="M1 146H28L1 238Z" fill="#8f6422"/>
    <circle cx="1" cy="176" r="7" fill="#16283a"/>
    <path d="M1 183V222" stroke="#16283a" stroke-width="4" stroke-linecap="round"/>
  </g>
  </g>
</svg>
